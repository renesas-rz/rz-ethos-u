# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rz-ethos-u-examples"
BBFILE_PATTERN_meta-rz-ethos-u-examples = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rz-ethos-u-examples = "6"

LAYERDEPENDS_meta-rz-ethos-u-examples = "core openembedded-layer meta-python meta-rz-ethos-u"
LAYERSERIES_COMPAT_meta-rz-ethos-u-examples = "scarthgap"
