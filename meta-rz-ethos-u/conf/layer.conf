# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rz-ethos-u"
BBFILE_PATTERN_meta-rz-ethos-u = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rz-ethos-u = "6"

LAYERDEPENDS_meta-rz-ethos-u = "core openembedded-layer meta-python"
LAYERSERIES_COMPAT_meta-rz-ethos-u = "scarthgap"
