; ------------------------------------------------------------
; System Config

; core_clock = NPU Clock = 1GHZ = 1,000,000,000 Hz
; axi0_port = Sram
; axi1_port = Dram (DDR)
; Sram clock scale = (memory_clock_in_Hz * memory_bus_width_in_bits) / (NPUCLK * 64)
; Dram clock scale = (memory_clock_in_Hz * memory_bus_width_in_bits) / (NPUCLK * 64)
[System_Config.RZG3E_DIRECT_DRIVE]
core_clock=1e9
axi0_port=Sram
axi1_port=Dram

Sram_clock_scale=1.0
Dram_clock_scale=1.0

; https://developer.arm.com/documentation/ka006173/1-0/?lang=en
; Dedicated SRAM: the SRAM is only for use by the Ethos-U
; The non-SRAM memory is assumed to be read-writeable
[Memory_Mode.Dedicated_Sram]
const_mem_area=Axi1
arena_mem_area=Axi1
cache_mem_area=Axi0
arena_cache_size=249856
